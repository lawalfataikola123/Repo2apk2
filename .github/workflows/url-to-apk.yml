name: URL to APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Website URL to convert (e.g. https://google.com)'
        required: true
      app_name:
        description: 'App Name'
        required: true
        default: 'My App'
      package_name:
        description: 'Package Name (e.g. com.myapp.website)'
        required: true
        default: 'com.repo2apk.app'
      app_color:
        description: 'App Theme Color (hex without #)'
        required: false
        default: '2196F3'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-url2apk-v1

      - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip -O /tmp/cmd.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          unzip -q /tmp/cmd.zip -d /tmp/cmd
          mv /tmp/cmd/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Validate inputs
        shell: bash
        env:
          SITE_URL: ${{ inputs.website_url }}
          APP_LABEL: ${{ inputs.app_name }}
          APP_PACKAGE: ${{ inputs.package_name }}
          APP_COLOR: ${{ inputs.app_color }}
        run: |
          set -euo pipefail
          [[ "$SITE_URL" =~ ^https://[^[:space:]]+$ ]] || { echo "Use a valid HTTPS website URL"; exit 1; }
          [[ "$APP_PACKAGE" =~ ^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*){1,}$ ]] || { echo "Invalid Android package name"; exit 1; }
          [[ "$APP_COLOR" =~ ^[0-9A-Fa-f]{6}$ ]] || { echo "Theme color must be 6 hex digits"; exit 1; }
          APP_LABEL_RE='^[A-Za-z0-9][A-Za-z0-9 ._-]{0,39}

      - name: Create WebView App
        env:
          APP_NAME_INPUT: ${{ inputs.app_name }}
          PACKAGE_INPUT: ${{ inputs.package_name }}
          URL_INPUT: ${{ inputs.website_url }}
          COLOR_INPUT: ${{ inputs.app_color }}
        run: |
          APP_NAME="$APP_NAME_INPUT"
          PKG="$PACKAGE_INPUT"
          URL="$URL_INPUT"
          COLOR="$COLOR_INPUT"
          PKG_PATH=$(echo $PKG | tr '.' '/')

          mkdir -p /tmp/webviewapp
          cd /tmp/webviewapp

          cat > settings.gradle << EOF
          rootProject.name = "WebViewApp"
          include ':app'
          EOF

          cat > build.gradle << EOF
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.5.0' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << EOF
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          EOF

          cat > gradlew << 'GRADLEW'
          #!/bin/sh
          exec gradle "$@"
          GRADLEW
          chmod +x gradlew

          mkdir -p app/src/main/java/$PKG_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > app/build.gradle << EOF
          plugins { id 'com.android.application' }
          android {
              namespace '$PKG'
              compileSdk 34
              defaultConfig {
                  applicationId '$PKG'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes {
                  release { minifyEnabled false }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <application
                  android:allowBackup="true"
                  android:label="$APP_NAME"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          URL_B64=$(printf '%s' "$URL" | base64 -w0)
          cat > app/src/main/java/$PKG_PATH/MainActivity.java << 'JAVA'
          package __PACKAGE__;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.util.Base64;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.PermissionRequest;
          import android.webkit.DownloadListener;
          import android.webkit.MimeTypeMap;
          import android.widget.Toast;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {
              private static final int FILE_PICKER = 4101;
              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;

              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("image/*");
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          try {
                              startActivityForResult(intent, FILE_PICKER);
                              return true;
                          } catch (ActivityNotFoundException e) {
                              fileCallback = null;
                              callback.onReceiveValue(null);
                              Toast.makeText(MainActivity.this, "No photo picker found", Toast.LENGTH_SHORT).show();
                              return false;
                          }
                      }
                      @Override public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> {
                              for (String r : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r) || PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)) {
                                      request.deny();
                                      return;
                                  }
                              }
                              request.grant(request.getResources());
                          });
                      }
                  });
                  webView.setDownloadListener((url, userAgent, disposition, mimeType, length) -> {
                      try {
                          DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                          req.setMimeType(mimeType);
                          String cookie = CookieManager.getInstance().getCookie(url);
                          if (cookie != null) req.addRequestHeader("Cookie", cookie);
                          req.addRequestHeader("User-Agent", userAgent);
                          req.setTitle("Saving edited photo");
                          req.setDescription("Photo editor download");
                          req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          String ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(mimeType);
                          String filename = "EditedPhoto_" + System.currentTimeMillis() + (ext == null ? ".jpg" : "." + ext);
                          req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, filename);
                          ((DownloadManager)getSystemService(DOWNLOAD_SERVICE)).enqueue(req);
                          Toast.makeText(this, "Download started", Toast.LENGTH_SHORT).show();
                      } catch (Exception e) {
                          Toast.makeText(this, "Unable to download image", Toast.LENGTH_SHORT).show();
                      }
                  });
                  String target = new String(Base64.decode("__URL_B64__", Base64.DEFAULT), StandardCharsets.UTF_8);
                  if (savedInstanceState == null) webView.loadUrl(target); else webView.restoreState(savedInstanceState);
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_PICKER && fileCallback != null) {
                      Uri[] results = null;
                      if (resultCode == RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              int count = data.getClipData().getItemCount();
                              results = new Uri[count];
                              for (int i = 0; i < count; i++) results[i] = data.getClipData().getItemAt(i).getUri();
                          } else if (data.getData() != null) results = new Uri[]{data.getData()};
                      }
                      fileCallback.onReceiveValue(results);
                      fileCallback = null;
                  }
              }

              @Override protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
              @Override protected void onDestroy() {
                  if (fileCallback != null) fileCallback.onReceiveValue(null);
                  if (webView != null) { webView.destroy(); webView = null; }
                  super.onDestroy();
              }
          }
          JAVA
          sed -i "s|__PACKAGE__|$PKG|; s|__URL_B64__|$URL_B64|" app/src/main/java/$PKG_PATH/MainActivity.java


          cat > app/src/main/res/values/colors.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="primary">#$COLOR</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
              </style>
          </resources>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: |
          cd /tmp/webviewapp
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          gradle assembleDebug --no-daemon -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true
          find . -name "*.apk" -exec cp {} /tmp/webview-app.apk \;
          echo "✅ APK built!"

      - name: Sign APK
        run: |
          keytool -genkey -v \
            -keystore /tmp/ks.keystore -alias app \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass pass1234 -keypass pass1234 \
            -dname "CN=Repo2APK,O=Repo2APK,C=NG" 2>/dev/null
          $HOME/android-sdk/build-tools/34.0.0/apksigner sign \
            --ks /tmp/ks.keystore --ks-alias app \
            --ks-pass pass:pass1234 --key-pass pass:pass1234 \
            --out /tmp/final.apk /tmp/webview-app.apk 2>/dev/null || \
            cp /tmp/webview-app.apk /tmp/final.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-webview-apk
          path: /tmp/final.apk
          retention-days: 7

      - name: Summary
        run: |
          echo "## ✅ URL to APK Complete!" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 URL | ${{ github.event.inputs.website_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 App | ${{ github.event.inputs.app_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Package | ${{ github.event.inputs.package_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📏 Size | $(du -sh /tmp/final.apk | cut -f1) |" >> $GITHUB_STEP_SUMMARY
